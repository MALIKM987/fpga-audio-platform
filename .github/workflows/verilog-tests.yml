name: Verilog Tests

on:
  push:
    branches:
      - fpga-only-fft-console
  pull_request:
    branches:
      - fpga-only-fft-console

jobs:
  verilog-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Show Icarus Verilog version
        run: iverilog -V

      - name: Run Verilog test suite
        run: python3 tools/run_all_tests.py
